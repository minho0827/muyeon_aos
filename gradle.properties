# 프로젝트 공통 Gradle 설정.
#
# ⚠️ 여기에는 비밀값을 넣지 않는다. 이 파일은 저장소에 들어간다.
#   릴리스 서명 키(MY_RELEASE_STORE_FILE / _PASSWORD / KEY_ALIAS / KEY_PASSWORD)는
#   local.properties 에서 읽고(app/build.gradle.kts), 서버 서비스 계정은
#   service-account.env 에서 읽는다. 둘 다 .gitignore 대상이다.
#
# 2026-09-19: 이 파일은 원래 .gitignore 에 있었다(whoneed_aos 복사 때 딸려온 설정).
#   그 탓에 새 PC·CI 에서 클론하면 android.useAndroidX 가 없어 빌드가 바로 실패했다.
#   비밀값이 들어갈 자리가 없는 파일이라 저장소에 포함한다.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX (AGP 필수)
android.useAndroidX=true
# R 클래스를 모듈별로 분리 — AGP 8 기본값이지만 명시해 둔다.
android.nonTransitiveRClass=true

kotlin.code.style=official

# 릴리스에서 R8/ProGuard 사용 여부. 없으면 false (app/build.gradle.kts 의 기본값).
#  ※ 각자 로컬 파일에서 true 로 쓰고 있었다면 아래 주석을 풀 것 — 여기서 임의로 켜면
#    난독화가 갑자기 켜져 릴리스 동작이 달라진다.
# enableProguardInReleaseBuilds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
